# Cloudflare Configuration for CargoFlow Web Frontend
name = "cargoflow-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".next"

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_API_URL = "https://api.cargoflow.com/api"
NEXT_PUBLIC_WS_URL = "https://api.cargoflow.com"
