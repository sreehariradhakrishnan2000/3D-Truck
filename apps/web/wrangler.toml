# Cloudflare Workers configuration for CargoFlow Web Frontend (OpenNext)
name = "cargoflow-web"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_API_URL = "https://api.cargoflow.com/api"
NEXT_PUBLIC_WS_URL = "https://api.cargoflow.com"
