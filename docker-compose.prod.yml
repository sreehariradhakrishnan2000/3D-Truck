version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargoflow_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cargoflow}
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cargoflow']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cargoflow}:${POSTGRES_PASSWORD:-cargoflow_prod_secret}@postgres:5432/${POSTGRES_DB:-cargoflow}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_URL: ${WEB_URL:-https://cargoflow.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://cargoflow.com}
      PORT: 3001
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.cargoflow.com/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://api.cargoflow.com}
      PORT: 3000
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379

volumes:
  postgres_prod_data:

