name: CargoFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Test Suites Across Workspaces
        run: npm test --workspaces --if-present

      - name: Build Core Packages
        run: |
          npm run build --workspace=@cargoflow/shared-types
          npm run build --workspace=@cargoflow/geometry
          npm run build --workspace=@cargoflow/validation
          npm run build --workspace=@cargoflow/packing-engine

      - name: Build NestJS API
        run: npm run build --workspace=@cargoflow/api

      - name: Build BullMQ Background Worker
        run: npm run build --workspace=@cargoflow/worker

      - name: Build Next.js Web Frontend
        run: npm run build --workspace=@cargoflow/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_WS_URL: http://localhost:3001

