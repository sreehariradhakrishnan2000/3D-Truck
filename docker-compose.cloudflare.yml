version: '3.9'

services:
  # ============================================================================
  # 1. NestJS Production API (REST + Socket.IO WebSockets)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      WEB_URL: ${WEB_URL:-https://3d-truck.sreehariradhakrishnan2000.workers.dev}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://3d-truck.sreehariradhakrishnan2000.workers.dev}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  # ============================================================================
  # 2. BullMQ Dedicated Background Worker (3D Packing Engine)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  # ============================================================================
  # 3. Redis (Cache & BullMQ Job Queue)
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ============================================================================
  # 4. Cloudflare Zero-Trust Tunnel Connector (cloudflared)
  # Routes api.yourdomain.com -> api:3001 with zero exposed inbound ports
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  redis_prod_data:
